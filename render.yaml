services:
  - type: web
    name: wren-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PGVECTOR_URL
        fromDatabase:
          name: wren-pgvector
          property: connectionString

databases:
  - name: wren-pgvector
    databaseName: wren
    postgresMajorVersion: "16"
    plan: free
